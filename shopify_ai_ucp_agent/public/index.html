<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopify Shopping Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-top">
        <div>
          <h1>Shopify Shopping Assistant</h1>
          <p>Ask about products, sizes, prices, or say what you'd like to buy.</p>
        </div>
        <div class="account-status" id="account-status"></div>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="messages" id="messages"></div>
    </main>

    <div class="cart-bar" id="cart-bar" hidden>
      <div class="cart-lines" id="cart-lines"></div>
      <div class="cart-footer">
        <div class="cart-total" id="cart-total"></div>
        <button type="button" class="checkout-btn" id="checkout-btn">
          Proceed to Checkout
        </button>
      </div>
    </div>

    <form class="composer" id="composer">
      <input
        type="text"
        id="input"
        placeholder="e.g. Do you have any t-shirts in blue?"
        autocomplete="off"
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="modal-backdrop" id="auth-modal-backdrop" hidden>
    <div class="modal" id="auth-modal">
      <div class="modal-header">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tab-login">Log In</button>
          <button type="button" class="auth-tab" id="tab-signup">Sign Up</button>
        </div>
        <button type="button" class="modal-close" id="auth-modal-close" aria-label="Close">×</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" autocomplete="email" required />
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <div class="auth-error" id="login-error" hidden></div>
        <button type="submit" class="auth-submit">Log In</button>
      </form>

      <form id="signup-form" class="auth-form" hidden>
        <input type="text" id="signup-first-name" placeholder="First name" autocomplete="given-name" required />
        <input type="text" id="signup-last-name" placeholder="Last name" autocomplete="family-name" required />
        <input type="email" id="signup-email" placeholder="Email" autocomplete="email" required />
        <input
          type="password"
          id="signup-password"
          placeholder="Password (min 5 characters)"
          autocomplete="new-password"
          minlength="5"
          required
        />
        <div class="auth-error" id="signup-error" hidden></div>
        <button type="submit" class="auth-submit">Sign Up</button>
      </form>

      <button type="button" class="auth-guest-link" id="continue-as-guest">
        Continue as guest instead
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
